version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    registries: "*"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      monthly-batch:
        patterns:
          - "*"
    ignore:
      # For @types/node, ignore all major version updates.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # For TypeScript, ignore all major version updates.
      - dependency-name: "typescript"
        update-types:
          ["version-update:semver-major"]
      # For eslint-plugin-prettier, ignore all major and minor version updates.
      - dependency-name: "eslint-plugin-prettier"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
      # For @typescript-eslint/eslint-plugin, ignore all major and minor version updates.
      - dependency-name: "@typescript-eslint/eslint-plugin"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      monthly-batch:
        patterns:
          - "*"
